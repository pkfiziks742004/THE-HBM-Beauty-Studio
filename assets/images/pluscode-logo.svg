<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 140" width="100%" height="100%">
  <defs>
    <style>
      .brand-text { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 900; }
      .tagline-text { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; letter-spacing: 2px; font-size: 13px; fill: #111; }
    </style>
  </defs>

  <!-- Left Icon Group -->
  <g transform="translate(10, 10)">
    <!-- Pixels / Dots floating top left -->
    <rect x="25" y="25" width="7" height="7" fill="#f36c21" rx="1"/>
    <rect x="35" y="25" width="7" height="7" fill="#f36c21" rx="1"/>
    <rect x="45" y="25" width="7" height="7" fill="#f36c21" rx="1"/>
    <rect x="30" y="35" width="7" height="7" fill="#f36c21" rx="1"/>
    <rect x="40" y="35" width="7" height="7" fill="#f36c21" rx="1"/>
    <rect x="50" y="35" width="7" height="7" fill="#f36c21" rx="1"/>
    <rect x="35" y="45" width="7" height="7" fill="#f36c21" rx="1"/>
    <rect x="45" y="45" width="7" height="7" fill="#f36c21" rx="1"/>

    <!-- Black Curved Bracket / D-shape -->
    <path d="M 60,30 C 85,30 105,45 105,65 C 105,85 85,100 60,100 L 60,90 C 80,90 95,78 95,65 C 95,52 80,40 60,40 Z" fill="#111111"/>

    <!-- Code symbol </> inside -->
    <text x="73" y="70" font-family="monospace" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">&lt;/&gt;</text>

    <!-- Orange Plus Sign (+) -->
    <path d="M 45,55 L 57,55 L 57,70 L 72,70 L 72,82 L 57,82 L 57,97 L 45,97 L 45,82 L 30,82 L 30,70 L 45,70 Z" fill="#f36c21"/>

    <!-- Bottom swoosh arcs -->
    <path d="M 5,90 C 15,115 85,120 125,95 C 105,115 35,115 15,95 Z" fill="#111111"/>
    <path d="M 115,90 C 135,105 140,115 130,120 C 115,118 100,105 90,95 Z" fill="#f36c21"/>
  </g>

  <!-- Right Text Group -->
  <!-- PLUS (Black) -->
  <text x="160" y="80" class="brand-text" font-size="52" fill="#111111" letter-spacing="2">PLUS</text>
  <!-- CODE (Orange) -->
  <text x="300" y="80" class="brand-text" font-size="52" fill="#f36c21" letter-spacing="2">CODE</text>

  <!-- Tagline: WE DESIGN | WE DEVELOP | WE DELIVER -->
  <text x="162" y="108" class="tagline-text">
    <tspan fill="#111111">WE DESIGN</tspan>
    <tspan fill="#f36c21"> | </tspan>
    <tspan fill="#111111">WE DEVELOP</tspan>
    <tspan fill="#f36c21"> | </tspan>
    <tspan fill="#111111">WE DELIVER</tspan>
  </text>
</svg>
